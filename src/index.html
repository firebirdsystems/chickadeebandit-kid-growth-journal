<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Growth Journal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: var(--hub-bg, #f9fafb); --surface: var(--hub-surface, #fff);
      --border: var(--hub-border, #e5e7eb); --border-mid: var(--hub-border, #d1d5db);
      --text: var(--hub-text, #000000); --muted: var(--hub-text-muted, #6b7280);
      --accent: var(--hub-primary, #16a34a); --accent-hover: var(--hub-primary-hover, #15803d);
      --accent-fg: var(--hub-primary-fg, #fff); --radius: var(--hub-radius, 8px);
      --shadow: 0 1px 3px rgba(15,23,42,.07);
    }
    body { min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: var(--hub-font-size, 15px); line-height: 1.5; }
    .app { max-width: 720px; margin: 0 auto; padding: 16px; }
    .topbar { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    h1 { font-size: 1.35rem; } h2 { font-size: 1rem; } h3 { font-size: .95rem; }
    .muted { color: var(--muted); } .tiny { font-size: .78rem; }
    .kids { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px; }
    .kid-chip { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--border); background: var(--surface); border-radius: 999px; padding: 5px 14px 5px 5px; cursor: pointer; white-space: nowrap; font-weight: 700; font-size: .85rem; }
    .kid-chip.active { border-color: var(--accent); color: var(--accent); }
    .avatar { width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: .78rem; font-weight: 800; flex-shrink: 0; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
    .sizes-card { border: 1px solid var(--border); }
    .sizes-grid { display: grid; gap: 10px 16px; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr)); margin: 12px 0; }
    .size-item { }
    .size-item dt { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 800; }
    .size-item dd { font-size: 1.1rem; font-weight: 700; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; border-radius: 8px; padding: 8px 12px; font: inherit; font-size: .86rem; font-weight: 700; cursor: pointer; min-height: 38px; background: var(--accent); color: var(--accent-fg); }
    .btn:hover { background: var(--accent-hover); } .btn:disabled { opacity: .5; cursor: default; }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--border-mid); }
    .btn-ghost:hover { background: var(--bg); }
    .btn-danger { background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); }
    .btn-sm { min-height: 31px; padding: 5px 9px; font-size: .78rem; }
    .timeline { position: relative; }
    .entry { display: grid; grid-template-columns: 96px 1fr; gap: 14px; margin-bottom: 16px; }
    .entry-photo { width: 96px; height: 96px; border-radius: 12px; object-fit: cover; background: var(--bg) center/cover; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; color: #94a3b8; }
    .entry-body { }
    .age-badge { display: inline-block; background: var(--hub-tint-success, #dcfce7); color: var(--hub-tint-success-fg, #15803d); font-weight: 800; border-radius: 999px; padding: 2px 10px; font-size: .8rem; }
    .measure { color: var(--muted); font-size: .82rem; margin: 4px 0; }
    .qa { margin: 4px 0; font-size: .88rem; }
    .qa .q { color: var(--muted); }
    .qa .a { font-weight: 600; }
    .empty { text-align: center; padding: 34px 16px; color: var(--muted); }
    .error { background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); padding: 9px 12px; border-radius: 8px; margin-bottom: 10px; font-size: .86rem; }
    .field { display: grid; gap: 4px; margin-bottom: 12px; }
    .two { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
    label { font-size: .74rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 800; }
    input, textarea, select { width: 100%; border: 1.5px solid var(--border-mid); border-radius: 8px; padding: 9px 11px; font: inherit; background: var(--surface); color: var(--text); }
    textarea { min-height: 46px; resize: vertical; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
    .upload-area { border: 2px dashed var(--border-mid); border-radius: 8px; padding: 14px; text-align: center; cursor: pointer; font-size: .85rem; color: var(--muted); }
    .upload-area:hover { border-color: var(--accent); }
    .q-block { margin-bottom: 10px; }
    .q-block label { text-transform: none; letter-spacing: 0; font-size: .85rem; color: var(--text); font-weight: 600; margin-bottom: 3px; display: block; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
    .modal { background: var(--surface); border-radius: 12px; padding: 20px; width: 100%; max-width: 480px; max-height: 92vh; overflow: auto; box-shadow: 0 20px 50px rgba(15,23,42,.25); }
    .modal h3 { margin-bottom: 14px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; position: sticky; bottom: -20px; background: var(--surface); padding: 10px 0 0; }
    @media (max-width: 520px) { .two { grid-template-columns: 1fr; } .entry { grid-template-columns: 72px 1fr; } .entry-photo { width: 72px; height: 72px; } }
    .search-row { margin-bottom: 12px; }
    .search-input {
      width: 100%; border: 1.5px solid var(--border-mid, var(--border, #d1d5db));
      border-radius: 8px; padding: 9px 11px; font: inherit;
      background: var(--surface, var(--card, #fff)); color: var(--text, inherit);
    }
    .search-input:focus { outline: none; border-color: var(--accent, #6366f1); }
  </style>
  <base href="/run/kid-growth-journal/">
</head>
<body>
<div class="app"><div id="root" class="empty">Loading…</div></div>

<script type="module">
import { esc, isAdult, memberColor, initial, hubConfirm, createFilesHelper, searchMatch, hubToday as today } from "/hub-sdk.js";
import { QUESTIONS, SIZE_FIELDS, fmtHeight, kidById as kidByIdOf, sizeFor as sizeForOf, searchableFields, interviewText } from "./logic.js";

const CONTEXT = window.__CONTEXT_URL ?? "";
const DB = window.__DB_URL ?? "";
const EVENTS_URL = window.__EVENTS_URL ?? "/api/events";
const APP_ID = window.__APP_ID ?? "kid-growth-journal";
const HUB_MEMBER = window.__CURRENT_MEMBER ?? null;
const files = createFilesHelper(window.__FILES_URL ?? "");

let members = [], me = null, kids = [];
let entries = [], sizes = [];
let selectedKid = null, error = "", modalEl = null;
let searchQ = "";       // in-app search (see logic.js searchableFields)

function nowIso() { return new Date().toISOString(); }
function uid(p) { return `${p}-${crypto.randomUUID()}`; }
function canEdit() { return isAdult(me); }

async function db(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sql, params }) });
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

async function loadMembers() {
  if (!CONTEXT) {
    members = [
      { id: "demo-1", name: "Alex", role: "adult" },
      { id: "kid-1", name: "Rowan", role: "child" },
      { id: "kid-2", name: "Sage", role: "child" },
    ];
  } else {
    try { const res = await fetch(`${CONTEXT}?keys=family.members`); members = ((await res.json())["family.members"]) ?? []; }
    catch { members = []; }
  }
  me = HUB_MEMBER ?? members[0] ?? { id: "guest", name: "Guest", role: "adult" };
  kids = members.filter(m => m.role === "child");
  // fall back: if no children defined, let any member be journaled
  if (!kids.length) kids = members;
  if (!selectedKid || !kids.some(k => k.id === selectedKid)) selectedKid = kids[0]?.id ?? null;
}

function seedDemo() {
  entries = [
    { id: "e1", kid_id: "kid-1", kid_name: "Rowan", entry_date: "2025-04-10", age_label: "Age 6", height_in: 45, weight_lb: 46,
      interview: JSON.stringify(QUESTIONS.map((q, i) => ({ q, a: ["Six!", "Green", "Mac and cheese", "A marine biologist", "Micah", "Build Lego cities", "Dog Man", "Pancake mornings", "Running fast", "Movie nights"][i] }))),
      note: "Lost first tooth this year.", photo_id: "", created_by: "demo-1", created_by_name: "Alex", created_at: nowIso() },
    { id: "e2", kid_id: "kid-1", kid_name: "Rowan", entry_date: "2024-04-10", age_label: "Age 5", height_in: 42, weight_lb: 41,
      interview: JSON.stringify(QUESTIONS.map((q, i) => ({ q, a: ["Five", "Blue", "Pizza", "A firefighter", "Micah", "Dinosaurs", "Bluey", "Ice cream", "Puzzles", "Snuggles"][i] }))),
      note: "", photo_id: "", created_by: "demo-1", created_by_name: "Alex", created_at: nowIso() },
  ];
  sizes = [
    { kid_id: "kid-1", kid_name: "Rowan", shirt: "6/7", pants: "6", shoe: "13C", coat: "7", other: "Hat: M", notes: "Runs a little big.", updated_by_name: "Alex", updated_at: nowIso() },
  ];
}

async function loadData() {
  if (!DB) { seedDemo(); return; }
  const [e, s] = await Promise.all([
    db("SELECT * FROM app_kid_growth_journal__entries ORDER BY entry_date DESC"),
    db("SELECT * FROM app_kid_growth_journal__sizes"),
  ]);
  entries = e.rows; sizes = s.rows;
}

async function init() {
  try { await loadMembers(); await loadData(); }
  catch (e) { error = e.message; }
  render();
}

function publish(type, payload) {
  fetch(EVENTS_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ source_app_id: APP_ID, type, payload }) }).catch(() => {});
}
function showError(msg) { error = msg; render(); }
function kidById(id) { return kidByIdOf(kids, members, id); }
function sizeFor(kidId) { return sizeForOf(sizes, kidId); }

/* ── modal ── */
function openModal(html) {
  closeModal();
  modalEl = document.createElement("div");
  modalEl.className = "modal-backdrop";
  modalEl.innerHTML = `<div class="modal">${html}</div>`;
  modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
  document.body.appendChild(modalEl);
  const f = modalEl.querySelector("[data-autofocus]"); if (f) f.focus();
}
function closeModal() { modalEl?.remove(); modalEl = null; }

/* ── entry ── */
function entryModal() {
  const kid = kidById(selectedKid);
  const uploadHtml = window.__FILES_URL ? `
    <div class="field"><label>Photo of the year (or a handprint!)</label>
      <label class="upload-area" for="f-photo">📷 Attach a photo</label>
      <input id="f-photo" type="file" accept="image/*" style="display:none">
      <img id="photo-preview" style="display:none;margin-top:8px;max-width:100%;border-radius:8px"></div>` : "";
  openModal(`
    <h3>New entry for ${esc(kid?.name ?? "this kid")}</h3>
    <form id="entry-form">
      <div class="two">
        <div class="field"><label for="f-age">Milestone</label><input id="f-age" data-autofocus placeholder="e.g. Age 6, 1st grade" value=""></div>
        <div class="field"><label for="f-date">Date</label><input id="f-date" type="date" value="${today()}"></div>
      </div>
      <div class="two">
        <div class="field"><label for="f-height">Height (inches)</label><input id="f-height" type="number" min="0" step="0.5" placeholder="e.g. 45"></div>
        <div class="field"><label for="f-weight">Weight (lb)</label><input id="f-weight" type="number" min="0" step="0.5" placeholder="e.g. 46"></div>
      </div>
      <h3 style="margin:14px 0 8px">The interview</h3>
      ${QUESTIONS.map((q, i) => `<div class="q-block"><label>${esc(q)}</label><input data-q="${i}" placeholder="Their words, exactly"></div>`).join("")}
      <div class="field"><label for="f-note">A note from you</label><textarea id="f-note" placeholder="Anything you want to remember about this year"></textarea></div>
      ${uploadHtml}
      <div class="modal-actions"><button type="button" class="btn btn-ghost" data-close>Cancel</button><button type="submit" class="btn">Save entry</button></div>
    </form>`);
  const fi = document.getElementById("f-photo");
  if (fi) fi.addEventListener("change", () => { const f = fi.files?.[0]; if (!f) return; const pv = document.getElementById("photo-preview"); pv.src = URL.createObjectURL(f); pv.style.display = "block"; });
}

async function submitEntry(form) {
  const kid = kidById(selectedKid); if (!kid) return;
  const btn = modalEl.querySelector(".btn[type=submit]"); btn.disabled = true; btn.textContent = "Saving…";
  const interview = QUESTIONS.map((q, i) => ({ q, a: (form.querySelector(`[data-q="${i}"]`)?.value ?? "").trim() })).filter(x => x.a);
  const heightVal = parseFloat(form["f-height"].value); const weightVal = parseFloat(form["f-weight"].value);
  const row = {
    id: uid("e"), kid_id: kid.id, kid_name: kid.name,
    entry_date: form["f-date"].value || today(), age_label: form["f-age"].value.trim(),
    height_in: isNaN(heightVal) ? null : heightVal, weight_lb: isNaN(weightVal) ? null : weightVal,
    interview: JSON.stringify(interview), note: form["f-note"].value.trim(), photo_id: "",
    created_by: me.id, created_by_name: me.name, created_at: nowIso(),
  };
  try {
    const file = document.getElementById("f-photo")?.files?.[0];
    if (file) { const up = await files.upload(file); row.photo_id = up.id; }
    if (DB) await db(`INSERT INTO app_kid_growth_journal__entries (id, kid_id, kid_name, entry_date, age_label, height_in, weight_lb, interview, note, photo_id, created_by, created_by_name, created_at) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?)`,
      [row.id, row.kid_id, row.kid_name, row.entry_date, row.age_label, row.height_in, row.weight_lb, row.interview, row.note, row.photo_id, row.created_by, row.created_by_name, row.created_at]);
    entries = [row, ...entries].sort((a, b) => b.entry_date.localeCompare(a.entry_date));
    closeModal(); render();
    publish("growth_journal.entry_added", { kid_id: row.kid_id, age_label: row.age_label });
  } catch (e) { btn.disabled = false; btn.textContent = "Save entry"; showError(e.message); }
}

async function deleteEntry(id) {
  const en = entries.find(x => x.id === id);
  if (!(await hubConfirm({ message: "Delete this entry?", destructive: true, confirmLabel: "Delete" }))) return;
  try {
    // The photo goes with the row: `manifest.delete_file_columns` has the hub
    // read `photo_id` off the doomed row and queue the R2 reclaim in the same
    // transaction. The trailing `files.delete(...).catch()` this replaces was
    // not awaited at all, so a closed tab between the two calls left the bytes
    // with no row to name them by — invisible to every view, and still billed.
    if (DB) await db("DELETE FROM app_kid_growth_journal__entries WHERE id=?", [id]);
    entries = entries.filter(x => x.id !== id); render();
  } catch (e) { showError(e.message); }
}

/* ── sizes ── */
function sizesModal() {
  const kid = kidById(selectedKid); const s = sizeFor(selectedKid) ?? {};
  openModal(`
    <h3>Current sizes — ${esc(kid?.name ?? "")}</h3>
    <p class="muted tiny" style="margin-bottom:12px">Keep this current so grandparents can shop with confidence.</p>
    <form id="sizes-form">
      <div class="two">
        ${SIZE_FIELDS.map(f => `<div class="field"><label for="sz-${f.key}">${f.label}</label><input id="sz-${f.key}" value="${esc(s[f.key] ?? "")}"></div>`).join("")}
      </div>
      <div class="field"><label for="sz-notes">Notes</label><textarea id="sz-notes" placeholder="Runs big, loves dinosaurs, no red…">${esc(s.notes ?? "")}</textarea></div>
      <div class="modal-actions"><button type="button" class="btn btn-ghost" data-close>Cancel</button><button type="submit" class="btn">Save sizes</button></div>
    </form>`);
}
async function submitSizes(form) {
  const kid = kidById(selectedKid); if (!kid) return;
  const btn = modalEl.querySelector(".btn[type=submit]"); btn.disabled = true; btn.textContent = "Saving…";
  const vals = {}; for (const f of SIZE_FIELDS) vals[f.key] = form[`sz-${f.key}`].value.trim();
  vals.notes = form["sz-notes"].value.trim();
  const row = { kid_id: kid.id, kid_name: kid.name, ...vals, updated_by_name: me.name, updated_at: nowIso() };
  try {
    if (DB) await db(`INSERT INTO app_kid_growth_journal__sizes (kid_id, kid_name, shirt, pants, shoe, coat, other, notes, updated_by_name, updated_at)
      VALUES (?,?,?,?,?,?,?,?,?,?)
      ON CONFLICT(kid_id) DO UPDATE SET kid_name=excluded.kid_name, shirt=excluded.shirt, pants=excluded.pants, shoe=excluded.shoe, coat=excluded.coat, other=excluded.other, notes=excluded.notes, updated_by_name=excluded.updated_by_name, updated_at=excluded.updated_at`,
      [row.kid_id, row.kid_name, row.shirt, row.pants, row.shoe, row.coat, row.other, row.notes, row.updated_by_name, row.updated_at]);
    sizes = [...sizes.filter(x => x.kid_id !== kid.id), row];
    closeModal(); render();
  } catch (e) { btn.disabled = false; btn.textContent = "Save sizes"; showError(e.message); }
}

function openWishlist() {
  window.parent.postMessage({ type: "hub:open", appId: "wishlist", params: { memberId: selectedKid } }, "*");
}

/* ── render ── */
function renderSizes(kid) {
  const s = sizeFor(kid.id);
  const filled = s && SIZE_FIELDS.some(f => s[f.key]);
  return `
    <div class="card sizes-card">
      <div class="topbar" style="margin-bottom:6px">
        <h2>📐 Current sizes</h2>
        <div style="display:flex;gap:6px">
          <button class="btn btn-ghost btn-sm" data-wishlist>🎁 Wishlist</button>
          ${canEdit() ? `<button class="btn btn-sm" data-sizes>${filled ? "Update" : "Add sizes"}</button>` : ""}
        </div>
      </div>
      ${filled ? `
        <dl class="sizes-grid">
          ${SIZE_FIELDS.filter(f => s[f.key]).map(f => `<div class="size-item"><dt>${f.label}</dt><dd>${esc(s[f.key])}</dd></div>`).join("")}
        </dl>
        ${s.notes ? `<div class="muted tiny">${esc(s.notes)}</div>` : ""}
        <div class="muted tiny" style="margin-top:6px">Updated by ${esc(s.updated_by_name || "—")}</div>
      ` : `<div class="muted tiny" style="padding:6px 0">No sizes recorded yet.${canEdit() ? " Add them so gift-buyers know what fits." : ""}</div>`}
    </div>`;
}

function renderEntry(en) {
  let qa = [];
  try { qa = JSON.parse(en.interview || "[]"); } catch { qa = []; }
  const photo = en.photo_id ? `<img class="entry-photo" src="${esc(files.url(en.photo_id))}" alt="">` : `<div class="entry-photo">🌱</div>`;
  const measures = [en.height_in ? `📏 ${esc(fmtHeight(en.height_in))}` : "", en.weight_lb ? `⚖️ ${esc(String(en.weight_lb))} lb` : ""].filter(Boolean).join(" · ");
  return `
    <div class="entry">
      ${photo}
      <div class="entry-body">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
          <span class="age-badge">${esc(en.age_label || en.entry_date)}</span>
          ${canEdit() ? `<button class="btn-ghost btn-sm btn" data-del-entry="${esc(en.id)}" style="border:0;color:var(--muted)">🗑️</button>` : ""}
        </div>
        <div class="measure">${esc(en.entry_date)}${measures ? ` · ${measures}` : ""}</div>
        ${qa.map(x => `<div class="qa"><span class="q">${esc(x.q)}</span> <span class="a">${esc(x.a)}</span></div>`).join("")}
        ${en.note ? `<div class="qa" style="margin-top:6px;font-style:italic">${esc(en.note)}</div>` : ""}
      </div>
    </div>`;
}

// render() rewrites the whole view, so put the caret back after typing.
document.addEventListener("input", (e) => {
  if (e.target.id !== "search") return;
  searchQ = e.target.value;
  const caret = e.target.selectionStart;
  render();
  const next = document.getElementById("search");
  if (next) { next.focus(); next.setSelectionRange(caret, caret); }
});

function render() {
  const root = document.getElementById("root");
  root.className = "";
  if (!kids.length) {
    root.innerHTML = `<div class="topbar"><h1>🌱 Growth Journal</h1></div><div class="empty">Add family members to start a journal for each kid.</div>`;
    return;
  }
  const kid = kidById(selectedKid);
  const allKidEntries = entries.filter(e => e.kid_id === selectedKid);
  const kidEntries = searchQ
    ? allKidEntries.filter(e => searchMatch(searchQ, searchableFields(e, interviewText(e.interview))))
    : allKidEntries;
  root.innerHTML = `
    <div class="topbar">
      <div><h1>🌱 Growth Journal</h1><p class="muted tiny">A keepsake that grows with them.</p></div>
      ${canEdit() && kid ? `<button class="btn" data-add>+ Add entry</button>` : ""}
    </div>
    ${error ? `<div class="error">${esc(error)}</div>` : ""}
    <div class="kids">
      ${kids.map(k => `<button class="kid-chip ${k.id === selectedKid ? "active" : ""}" data-kid="${esc(k.id)}">
        <span class="avatar" style="background:${esc(memberColor(k.id, members))}">${esc(initial(k.name))}</span>${esc(k.name)}</button>`).join("")}
    </div>
    ${kid ? renderSizes(kid) : ""}
    <h2 style="margin:0 2px 10px">Through the years</h2>
    ${allKidEntries.length ? `<div class="search-row"><input id="search" class="search-input" type="search" placeholder="Search the journal…" aria-label="Search the journal" value="${esc(searchQ)}" /></div>` : ""}
    <div class="timeline">
      ${kidEntries.length ? kidEntries.map(renderEntry).join("") : `<div class="empty">${searchQ ? `No entries match "${esc(searchQ)}".` : `No entries yet.${canEdit() ? " Capture this year's interview." : ""}`}</div>`}
    </div>`;
}

document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-kid]");
  if (!t) return;
  if (t.dataset.kid) { selectedKid = t.dataset.kid; error = ""; render(); return; }
  if (t.dataset.close !== undefined) { closeModal(); return; }
  if (t.dataset.add !== undefined) return entryModal();
  if (t.dataset.sizes !== undefined) return sizesModal();
  if (t.dataset.wishlist !== undefined) return openWishlist();
  if (t.dataset.delEntry) return deleteEntry(t.dataset.delEntry);
});

document.addEventListener("submit", e => {
  e.preventDefault();
  if (e.target.id === "entry-form") submitEntry(e.target);
  else if (e.target.id === "sizes-form") submitSizes(e.target);
});

init();
</script>
</body>
</html>
